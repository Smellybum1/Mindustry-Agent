# Keep this file on the default branch so GitHub registers manual dispatch.
name: Coop Agent CI

on:
  push:
    branches:
      - coop-agent/**
      - codex/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coop-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test pinned environment
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify toolchain and source pins
        run: bash scripts/bootstrap.sh

      - name: Install hash-locked Python test runtime
        run: |
          python -m pip install --require-hashes -r python/requirements-rl-linux-py312.lock
          python -m pip install --require-hashes -r python/requirements-dev-linux-py312.lock

      - name: Run Python and Java tests
        run: make test

      - name: Build custom distributions
        run: bash scripts/build.sh
