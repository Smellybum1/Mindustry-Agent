// rl-server — custom externally-stepped headless launcher (ADR-0002).
//
// Replaces the wall-clock server loop with an externally controlled fixed-step
// simulation loop. Depends only on the pinned upstream :core (engine); the Arc
// mock backend (arc.mock.*) is pulled in transitively via :core's api dependency
// on arc-core, so no :server / backend-headless dependency is needed.
//
// Repositories, Java 17 release target, and JavaCompile options are applied by the
// root build.gradle to all subprojects; keep this file minimal.
//
// IMPORTANT (see docs/ENGINE_NOTES.md §1, and ServerLauncher working-dir assumptions):
// Mindustry resolves internal assets (e.g. icons/icons.properties, baseparts) with a
// plain arc.files.Fi of type `internal`, which reads from the JVM WORKING DIRECTORY.
// Both the `dist` jar (via the Python launcher) and the `runRl` task therefore MUST be
// executed with the working directory set to ../core/assets.

apply plugin: "java"

sourceSets.main.java.srcDirs = ["src/main/java"]

project.ext.mainClassName = "mindustry.rl.RlServerMain"
project.ext.assetsDir = new File("../core/assets")

dependencies{
    implementation project(":core")
    //M3: the shared skill FSM layer (agentcore.skill); the engine-facing SkillController
    //and RlAgentRegistry live here and wrap live units through agentcore.skill.AgentBody.
    implementation project(":agent-core")

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.7.1"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.7.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test{
    useJUnitPlatform()
}

// Single source of truth for the scenario: copy the checked-in machine-readable spec
// onto the classpath so mindustry.rl.Scenario parses it at runtime (no hardcoded values).
// The file stays authored under scenarios/; this only mirrors it into build outputs.
processResources{
    from("../scenarios/bootstrap-defense-v0"){
        include "scenario.json"
        into "scenarios/bootstrap-defense-v0"
    }
    from("../scenarios/bootstrap-defense-adaptive-probe"){
        include "scenario.json"
        into "scenarios/bootstrap-defense-adaptive-probe"
    }
    from("../scenarios/bootstrap-defense-v1"){
        include "scenario.json"
        into "scenarios/bootstrap-defense-v1"
    }
    from("../scenarios/schematics"){
        include "*.json"
        into "scenarios/schematics"
    }
}

// Self-contained fat jar. Runnable via `java -jar` (with cwd = ../core/assets).
tasks.register('dist', Jar){
    dependsOn configurations.runtimeClasspath
    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
    from{ configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) } }

    duplicatesStrategy = 'exclude'
    exclude("META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA")

    archiveFileName = 'rl-server.jar'

    manifest{
        attributes 'Main-Class': project.mainClassName
    }
}

dist.dependsOn classes

// Gradle-driven run with the correct working directory for asset resolution.
tasks.register('runRl', JavaExec){
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    standardInput = System.in
    ignoreExitValue = true
    if(project.hasProperty("appArgs")){
        args Eval.me(appArgs)
    }
}
